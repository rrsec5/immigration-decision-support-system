name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0

        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: immigration_decision_support

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load database schema
        run: |
          mysql \
          -h 127.0.0.1 \
          -uroot \
          -proot \
          immigration_decision_support < database/database.sql

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('backend/**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build and test backend
        working-directory: backend

        env:
          DB_URL: jdbc:mysql://localhost:3306/immigration_decision_support
          DB_USERNAME: root
          DB_PASSWORD: root

          JWT_SECRET: ChangeThisSecretValueToYourOwnJwtSecretWhichSizeIsMoreThan256Bits
          JWT_EXPIRATION: 86400000

        run: mvn clean verify

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        run: pnpm build

      # - name: Run frontend tests
      #   working-directory: frontend
      #   run: npm test

  docker:
    name: Docker
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        run: docker compose config

      - name: Build Docker images
        run: docker compose build

  helm:
    name: Helm Validation

    runs-on: ubuntu-latest

    needs:
      - docker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Verify Helm installation
        run: helm version

      - name: Lint Helm Chart
        run: |
          helm lint helm/immigration-system \
            -f helm/immigration-system/values.yaml \
            -f helm/immigration-system/values-ci.yaml \
            -f helm/immigration-system/values-secret.example.yaml

      - name: Render Kubernetes manifests
        run: |
          helm template immigration-system \
            helm/immigration-system \
            -f helm/immigration-system/values.yaml \
            -f helm/immigration-system/values-ci.yaml \
            -f helm/immigration-system/values-secret.example.yaml \
            > rendered-manifests.yaml

      - name: Upload rendered manifests
        uses: actions/upload-artifact@v4
        with:
          name: rendered-manifests
          path: rendered-manifests.yaml

      - name: Install kubeconform
        run: |
          curl -L https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar xz
          sudo mv kubeconform /usr/local/bin

      - name: Validate Kubernetes manifests
        run: |
          kubeconform \
            -strict \
            -summary \
            rendered-manifests.yaml

      - name: Verify rendered resources
        run: |
          grep "kind: Deployment" rendered-manifests.yaml
          grep "kind: StatefulSet" rendered-manifests.yaml
          grep "kind: Service" rendered-manifests.yaml
          grep "kind: ConfigMap" rendered-manifests.yaml
          grep "kind: Secret" rendered-manifests.yaml
          grep "kind: Ingress" rendered-manifests.yaml

      - name: Verify CI images
        run: |
          grep "rrsec5/eureka-service:ci" rendered-manifests.yaml
          grep "rrsec5/api-gateway:ci" rendered-manifests.yaml
          grep "rrsec5/user-service:ci" rendered-manifests.yaml
          grep "rrsec5/country-service:ci" rendered-manifests.yaml
          grep "rrsec5/recommendation-service:ci" rendered-manifests.yaml
          grep "rrsec5/frontend:ci" rendered-manifests.yaml
