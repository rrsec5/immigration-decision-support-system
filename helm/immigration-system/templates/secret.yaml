apiVersion: v1
kind: Secret

metadata:

  name: {{ include "immigration-system.name" . }}-secret
  namespace: {{ .Values.namespace }}

  labels:
    {{- include "immigration-system.labels" . | nindent 4 }}

type: Opaque

stringData:

  DB_PASSWORD: {{ required "secret.dbPassword is required" .Values.secret.dbPassword | quote }}

  MYSQL_ROOT_PASSWORD: {{ required "secret.mysqlRootPassword is required" .Values.secret.mysqlRootPassword | quote }}

  JWT_SECRET: {{ required "secret.jwtSecret is required" .Values.secret.jwtSecret | quote }}