apiVersion: apps/v1
kind: Deployment

metadata:
  name: eureka
  namespace: immigration-support-system

spec:
  replicas: 1

  selector:
    matchLabels:
      app: eureka-service

  template:
    metadata:
      labels:
        app: eureka-service
        version: "1.1"

    spec:
      containers:
        - name: eureka-service
          image: rrsec5/eureka-service:1.1
          imagePullPolicy: IfNotPresent

          resources:
            requests:
              cpu: 100m
              memory: 256Mi

            limits:
              cpu: 300m
              memory: 512Mi

          ports:
            - containerPort: 8761

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8761

            initialDelaySeconds: 40
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8761

            initialDelaySeconds: 60
            periodSeconds: 20
