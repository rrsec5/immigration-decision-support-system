apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: immigration-support-system

spec:
  replicas: 1

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend

          image: rrsec5/frontend:1.0

          ports:
            - containerPort: 80
